<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiros demo | Esports Casa Apuesta</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <header class="site-header">
        <div class="contenedor">
            <a href="../index.html" class="logo-link">
                <img src="../assets/img/logo.png" alt="Logo Esports Casa Apuesta">
                <span>ESPORTS CASA APUESTA</span>
            </a>
            <nav class="nav-principal" aria-label="Menu principal">
                <ul>
                    <li><a href="eventos.html">Eventos</a></li>
                    <li><a href="apuestas.html">Apuestas</a></li>
                    <li><a href="acerca-de.html">Acerca de</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
            <div class="acciones-usuario">
                <a href="mi-perfil.html" class="btn btn-primario">Mi perfil</a>
            </div>
        </div>
    </header>

    <main>
        <div class="contenedor pagina-titulo">
            <h1>Solicitar retiro (demo)</h1>
            <p class="aviso-demo">No se ejecutan transacciones reales. Saldo mostrado en perfil: $ 1,250.00 ficticios.</p>
        </div>

        <section class="seccion">
            <div class="contenedor">
                <form class="formulario formulario-ancho" action="#" method="post">
                    <div class="campo">
                        <label for="monto-retiro">Monto a retirar</label>
                        <input type="number" id="monto-retiro" name="monto-retiro" min="1" max="1250" placeholder="200" required>
                    </div>
                    <div class="campo">
                        <label for="cuenta-demo">Cuenta destino (texto de ejemplo)</label>
                        <input type="text" id="cuenta-demo" name="cuenta-demo" placeholder="**** demo ****" required>
                    </div>
                    <div class="campo">
                        <label for="notas">Notas</label>
                        <textarea id="notas" name="notas" rows="3" placeholder="Comentario opcional"></textarea>
                    </div>
                    <button type="submit" class="btn btn-violeta">Enviar solicitud demo</button>
                    <p class="form-enlace"><a href="historial.html">Ver historial de movimientos</a></p>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="contenedor">
            <p class="footer-copy">Esports Casa Apuesta · Programacion WEB · Demo academica</p>
        </div>
    </footer>

</body>
</html>
