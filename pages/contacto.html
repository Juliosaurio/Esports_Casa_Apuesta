<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Esports Casa Apuesta</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <header class="site-header">
        <div class="contenedor">
            <a href="../index.html" class="logo-link">
                <img src="../assets/img/logo.png" alt="Logo Esports Casa Apuesta">
                <span>ESPORTS CASA APUESTA</span>
            </a>
            <nav class="nav-principal" aria-label="Menu principal">
                <ul>
                    <li><a href="eventos.html">Eventos</a></li>
                    <li><a href="apuestas.html">Apuestas</a></li>
                    <li><a href="acerca-de.html">Acerca de</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
            <div class="acciones-usuario">
                <a href="login.html" class="btn btn-secundario">Iniciar sesion</a>
                <a href="registro.html" class="btn btn-primario">Registrarse</a>
            </div>
        </div>
    </header>

    <main>
        <div class="contenedor pagina-titulo">
            <h1>Contacto</h1>
            <p class="aviso-demo">Formulario de demostracion: no envia mensajes a ningun servidor todavia.</p>
        </div>

        <section class="seccion">
            <div class="contenedor">
                <form class="formulario formulario-ancho" action="#" method="post">
                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="campo">
                        <label for="correo">Correo electronico</label>
                        <input type="email" id="correo" name="correo" required>
                    </div>
                    <div class="campo">
                        <label for="asunto">Asunto</label>
                        <input type="text" id="asunto" name="asunto" required>
                    </div>
                    <div class="campo">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primario">Enviar mensaje (demo)</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="contenedor">
            <div class="footer-columnas">
                <div>
                    <h3>Navegacion</h3>
                    <ul>
                        <li><a href="../index.html">Inicio</a></li>
                        <li><a href="acerca-de.html">Acerca de</a></li>
                    </ul>
                </div>
            </div>
            <p class="footer-copy">Esports Casa Apuesta · Programacion WEB · Demo academica</p>
        </div>
    </footer>

</body>
</html>
